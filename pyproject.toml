[project]
name = "copa-ai-backend"
version = "1.0.0"
description = "Backend da CopaAI"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "groq>=0.9.0",
    "gunicorn>=22.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
